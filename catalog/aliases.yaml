# ============================================================
# Alias table (business names -> catalog entities)
#
# One row per (entity_id, alias). In production this is a DB table fed by several
# sources, each with a default confidence (overridable per row):
#
#   source      confidence  origin
#   curated     1.0         hand-written, git reviewed (core metrics / definitions)
#   glossary    0.9         catalog business glossary term bound to a column/metric
#   comment     0.7         derived from catalog column comments
#   query_log   0.6         mined from historical SQL + ticket / question text
#   llm         0.5         generated offline from names/comments/samples; starts `pending`
#   feedback    0.6         user picks in the confirmation flow; promoted after accumulating
#
#   status: approved (default) | pending — pending rows are not indexed until reviewed
#   entity_id: table:<t> | column:<t>.<c> | metric:<m>
#   The canonical table/column/metric name is always an alias; it is added by the
#   loader and not listed here.
#
# Ambiguous aliases on purpose ("amount", "time", "status", "region") so that the
# confirmation / rerank flow has something to do.
# ============================================================
